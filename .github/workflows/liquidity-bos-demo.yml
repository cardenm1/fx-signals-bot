
name: Liquidity BOS DEMO

on:
  workflow_dispatch:
  schedule:
  - cron: `*/5 * * * *`
  permissions:
  contents: read

concurrency:
  group: liquidity-bos-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy dukascopy-python python-telegram-bot

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: liquidity_alert_state.json
          key: liquidity-bos-state-${{ github.run_id }}
          restore-keys: |
            liquidity-bos-state-

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python liquidity_alerts.py

      - name: Save signal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: liquidity_alert_state.json
          key: liquidity-bos-state-${{ github.run_id }}
