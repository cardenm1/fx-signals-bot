name: Liquidity BOS DEMO
"on":
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'self-test, live-data (all pairs, no Telegram), or observe'
        type: choice
        options: [self-test, live-data, observe]
        default: self-test
      initialize_state:
        description: 'Create dedicated state branch ONLY on first observe run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: liquidity-bos-demo-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-liquidity.txt
      - run: python -m pip install -r requirements-liquidity.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_liquidity*.py' -v
      - name: Real Dukascopy quotes, all supported pairs
        if: ${{ inputs.mode == 'live-data' }}
        run: python liquidity_feed.py
      - name: Restore durable state
        if: ${{ inputs.mode == 'observe' || (github.event_name == 'schedule' && vars.LIQUIDITY_BOS_ENABLED == 'true') }}
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INITIALIZE: ${{ inputs.initialize_state }}
        shell: bash
        run: |
          args=()
          if [[ "$INITIALIZE" == 'true' ]]; then args+=(--initialize); fi
          python liquidity_state.py --root "$RUNNER_TEMP/liquidity-state" "${args[@]}"
      - name: Commands and demo signals
        if: ${{ steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIQUIDITY_STATE_FILE: ${{ runner.temp }}/liquidity-state/liquidity_bot_state.json
          LIQUIDITY_REMOTE_STATE: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python liquidity_alerts.py
