
name: Liquidity BOS DEMO

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: liquidity-bos-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            pandas \
            numpy \
            dukascopy-python \
            python-telegram-bot

      - name: Run Telegram commands and market checks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python liquidity_alerts.py

      - name: Save persistent state
        if: always()
        run: |
          if [ -f liquidity_bot_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add liquidity_bot_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update liquidity bot state [skip ci]"
              git push origin HEAD:main
            fi
          fi
