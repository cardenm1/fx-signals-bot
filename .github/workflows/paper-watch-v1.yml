name: GBPUSD Strategy v1.0 PAPER

# No schedule/push/pull_request trigger. Automatic operation is NOT enabled.
# After explicit approval only, add schedule: cron '2-57/5 * * * *'.
"on":
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "self-test (offline) or observe (single bounded collection)"
        type: choice
        options: [self-test, observe]
        default: self-test
      publish:
        description: "PAPER Telegram; requires separate repository approval variable"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gbpusd-paper-watch-v1-state
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  self-test:
    if: ${{ inputs.mode == 'self-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/paper_watch/requirements.txt
      - name: Offline tests; no market or Telegram secrets
        run: python -m unittest research.paper_watch.test_watch research.paper_watch.test_fixes research.paper_watch.test_github -v

  observe:
    if: ${{ (github.event_name == 'schedule' || inputs.mode == 'observe') && vars.PAPER_WATCH_ENABLED == 'true' }}
    environment: paper-watch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r research/paper_watch/requirements.txt
      - name: Define isolated state directory
        run: echo "STATE_ROOT=$RUNNER_TEMP/gbpusd-paper-state" >> "$GITHUB_ENV"
      - name: Restore authoritative state branch; never implicitly initialize
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m research.paper_watch.state_store restore --root "$STATE_ROOT"
      - name: One bounded signal-only collection; no publication
        id: collect
        run: python -m research.paper_watch.github_runner once --root "$STATE_ROOT"
      - name: Persist checkpoints, journals and errors even after collection failure
        id: persist
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m research.paper_watch.state_store save --root "$STATE_ROOT"
      - name: Opt-in new PAPER signals only; persist intent before sending
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish) && vars.PAPER_WATCH_TELEGRAM_ENABLED == 'true' && steps.persist.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAPER_WATCH_TELEGRAM_ENABLED: ${{ vars.PAPER_WATCH_TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m research.paper_watch.telegram_outbox --root "$STATE_ROOT" --approve-publication
      - name: Upload diagnostic summary (not authoritative state)
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-watch-v1-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STATE_ROOT }}/status.json
          if-no-files-found: ignore
          retention-days: 30
